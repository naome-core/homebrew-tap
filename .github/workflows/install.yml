name: Test Homebrew installs

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      base_sha:
        type: string
        default: ""
      formula_patch:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  install:
    name: Install and test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04]

    steps:
      - name: Set up Homebrew and check out the tap
        uses: Homebrew/actions/setup-homebrew@61b401267256bb9c047d6d1481b176d5772a0ba7
        with:
          stable: true

      - name: Apply the candidate formula changes
        if: inputs.formula_patch
        env:
          NAOME_BASE_SHA: ${{ inputs.base_sha }}
          NAOME_FORMULA_PATCH: ${{ inputs.formula_patch }}
        run: |
          git fetch --no-tags origin "$NAOME_BASE_SHA"
          git checkout --detach "$NAOME_BASE_SHA"
          python3 -c 'import base64, os, sys; sys.stdout.buffer.write(base64.b64decode(os.environ["NAOME_FORMULA_PATCH"], validate=True))' | git apply

      - name: Install and test NAOME Network
        if: runner.os == 'macOS'
        run: |
          brew install naome-core/tap/naome-network
          brew test naome-network

      - name: Install and test NAOME Protocol
        run: |
          brew install naome-core/tap/naome-protocol
          brew test naome-protocol
